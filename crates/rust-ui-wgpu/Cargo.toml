[package]
name = "rust-ui-wgpu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "wgpu + winit rendering backend for rust-ui"
keywords = ["ui", "gui", "wgpu", "winit"]
categories = ["gui", "rendering"]

[dependencies]
rust-ui = { workspace = true }

# Windowing
winit = "0.30"

# GPU rendering
wgpu = "23"

# Vector graphics (text, shapes)
vello = "0.4"

# Font handling
cosmic-text = "0.12"

# Geometry / color types used by vello
kurbo  = "0.11"
peniko = "0.3"

# Async for wgpu init
pollster = "0.4"
